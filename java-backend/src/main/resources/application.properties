server.port=8080
# Database configuration (use Postgres in docker-compose for development)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:pissirdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDL_AUTO:update}
spring.h2.console.enabled=true

# JWT secret (override in env for production)
jwt.secret=${JWT_SECRET:verysecretkey}
