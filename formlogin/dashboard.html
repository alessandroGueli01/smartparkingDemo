<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard - Pissir</title>
  <style>
    :root {
      --bg: #1f2029;
      --panel: #2b2e38;
      --text: #ffeba7;
      --muted: #c4c3ca;
      --black: #020305;
      --line: rgba(255,255,255,0.08);
      --green: #22c55e;
      --red: #ef4444;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'Poppins', sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px 20px;
    }

    .card {
      width: min(1120px, 100%);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 20px;
      box-shadow: 0 18px 40px rgba(0,0,0,0.18);
      padding: 28px 26px;
    }

    .topbar, .actions, .metrics { display: flex; align-items: center; gap: 14px; }
    .topbar { justify-content: space-between; flex-wrap: wrap; }
    .metrics { display: grid; grid-template-columns: repeat(4, 1fr); margin: 24px 0; }
    .metric { border-top: 1px solid var(--line); padding: 16px 0; }
    .metric strong { display: block; font-size: 1.7rem; }
    .metric span { color: var(--muted); font-size: 0.85rem; }
    .date-field { display: flex; align-items: center; gap: 12px; margin-top: 20px; color: var(--muted); }
    .date-field input { min-height: 42px; border: 1px solid var(--line); border-radius: 8px; padding: 0 10px; background: #1f2029; color: var(--text); font: inherit; }
    .parking-grid { display: grid; grid-template-columns: repeat(10, minmax(28px, 1fr)); gap: 7px; margin-top: 14px; }
    .spot { min-height: 44px; border: 1px solid var(--line); border-radius: 7px; color: var(--text); background: #242833; font-size: 0.72rem; font-weight: 700; }
    .spot.free { background: rgba(34,197,94,0.15); border-color: rgba(34,197,94,0.4); }
    .spot.reserved { background: rgba(245,158,11,0.16); border-color: rgba(245,158,11,0.45); }
    .spot.occupied { background: rgba(239,68,68,0.15); border-color: rgba(239,68,68,0.4); }
    .spot.charging { background: rgba(96,165,250,0.16); border-color: rgba(96,165,250,0.4); }
    .section-heading { margin: 24px 0 0; }
    @media (max-width: 600px) {
      .metrics { grid-template-columns: 1fr; gap: 0; }
      .parking-grid { grid-template-columns: repeat(5, minmax(28px, 1fr)); }
      .card { padding: 22px 16px; }
    }

    .eyebrow {
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: var(--muted);
      font-size: 11px;
      margin-bottom: 10px;
      display: block;
    }

    h1 {
      margin: 0 0 16px;
      font-size: clamp(2rem, 3vw, 2.8rem);
    }

    .user-badge {
      display: inline-block;
      background: var(--text);
      color: var(--black);
      font-weight: 800;
      padding: 8px 14px;
      border-radius: 999px;
      margin-bottom: 18px;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      margin-top: 22px;
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 16px 22px;
      font-size: 0.95rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.12s ease, filter 0.12s ease;
    }

    button:hover {
      transform: translateY(-1px);
      filter: brightness(1.04);
    }

    .primary {
      background: var(--text);
      color: var(--black);
    }

    .secondary {
      border: 1px solid rgba(255,255,255,0.14);
      background: transparent;
      color: var(--text);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="topbar">
      <div>
        <span class="eyebrow">Pissir · Area utente</span>
        <h1>Parcheggio</h1>
      </div>
      <div>
        <span class="user-badge" id="userBadge">Utente</span>
        <button class="secondary" id="logoutBtn" type="button">Logout</button>
      </div>
    </div>

    <div class="metrics" aria-live="polite">
      <div class="metric"><strong id="freeCount">0</strong><span>Posti liberi</span></div>
      <div class="metric"><strong id="reservedCount">0</strong><span>Prenotati</span></div>
      <div class="metric"><strong id="occupiedCount">0</strong><span>Occupati</span></div>
      <div class="metric"><strong id="chargingCount">0</strong><span>In ricarica</span></div>
    </div>

    <h2 class="section-heading">Stato dei posti</h2>
    <label class="date-field" for="availabilityDate">Data
      <input id="availabilityDate" type="date">
    </label>
    <div id="parkingGrid" class="parking-grid" aria-label="Mappa dei posti auto"></div>

    <div class="actions">
      <button class="primary" id="goBooking">Prenota posto</button>
    </div>
  </div>

  <script>
    const auth = JSON.parse(localStorage.getItem('pissir_auth') || 'null');
    if (!auth || !auth.token) {
      window.location.href = '/';
    } else if (auth.user && auth.user.tipo === 'admin') {
      window.location.href = '/admin';
    }

    const userBadge = document.getElementById('userBadge');
    if (userBadge && auth && auth.user) {
      userBadge.textContent = auth.user.username || 'Utente';
    }

    document.getElementById('goBooking').addEventListener('click', () => {
      window.location.href = '/booking.html';
    });

    document.getElementById('logoutBtn').addEventListener('click', () => {
      localStorage.removeItem('pissir_auth');
      sessionStorage.clear();
      window.location.href = '/';
    });

    function getParkingState() {
      try {
        const state = JSON.parse(localStorage.getItem('pissir_parking_state') || 'null');
        if (Array.isArray(state) && state.length === 20) return state;
      } catch (error) {}

      const state = Array.from({ length: 20 }, (_, index) => {
        const isMwbot = index >= 10;
        const status = isMwbot
          ? (index % 5 === 0 ? 'occupied' : index % 3 === 0 ? 'charging' : 'free')
          : (index % 6 === 0 ? 'occupied' : index % 4 === 0 ? 'charging' : 'free');
        return { id: index + 1, type: isMwbot ? 'mwbot' : 'standard', status, battery: status === 'charging' ? 35 + ((index * 9) % 55) : 0 };
      });
      localStorage.setItem('pissir_parking_state', JSON.stringify(state));
      return state;
    }

    function localDateString(date = new Date()) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, '0');
      const day = String(date.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    function renderParkingState() {
      const state = getParkingState();
      const date = document.getElementById('availabilityDate').value;
      let counts = { free: 0, reserved: 0, occupied: 0, charging: 0 };
      document.getElementById('parkingGrid').innerHTML = state.map(spot => {
        const type = spot.type === 'mwbot' ? 'MWBOT' : 'Standard';
        let status = 'free';
        const reservationExists = getReservations().some(reservation =>
          Number(reservation.placeId) === Number(spot.id) && reservation.date === date && reservation.status !== 'cancelled'
        );
        if (reservationExists) status = 'reserved';
        else if (date === localDateString() && ['occupied', 'charging'].includes(spot.status)) status = spot.status;
        counts[status] += 1;
        const battery = status === 'charging' ? ` · ${spot.battery}%` : '';
        return `<div class="spot ${status}" title="Posto ${spot.id} · ${type} · ${status}${battery}">${spot.id}</div>`;
      }).join('');
      document.getElementById('freeCount').textContent = counts.free;
      document.getElementById('reservedCount').textContent = counts.reserved;
      document.getElementById('occupiedCount').textContent = counts.occupied;
      document.getElementById('chargingCount').textContent = counts.charging;
    }

    function getReservations() {
      try {
        const reservations = JSON.parse(localStorage.getItem('pissir_reservations') || '[]');
        return Array.isArray(reservations) ? reservations : [];
      } catch (error) {
        return [];
      }
    }

    const availabilityDate = document.getElementById('availabilityDate');
    availabilityDate.min = localDateString();
    const savedDate = localStorage.getItem('pissir_availability_date');
    availabilityDate.value = savedDate && savedDate >= availabilityDate.min ? savedDate : availabilityDate.min;
    availabilityDate.addEventListener('change', () => {
      localStorage.setItem('pissir_availability_date', availabilityDate.value);
      renderParkingState();
    });

    renderParkingState();
  </script>
</body>
</html>
