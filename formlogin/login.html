<!doctype html>
<html lang="en">
<head>
  <title>Ricarica</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <link rel="stylesheet" href="https://unicons.iconscout.com/release/v2.1.9/css/unicons.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/4.5.0/css/bootstrap.min.css">
<link rel="stylesheet" href="login.css">
</head>
<body>
	<div class="section">
		<div class="container">
			<div class="row full-height justify-content-center">
				<div class="col-12 text-center align-self-center py-5">
					<div class="section pb-5 pt-5 pt-sm-2 text-center">
						<h6 class="mb-0 pb-3"><span>Login </span>
                            <span>Registrati</span></h6>
			          	<input class="checkbox" type="checkbox" id="reg-log" name="reg-log"/>
			          	<label for="reg-log"></label>
						<div class="card-3d-wrap mx-auto">
							<div class="card-3d-wrapper">
								<div class="card-front">
									<div class="center-wrap">
										<div class="section text-center">
											<h4 class="mb-4 pb-3">Login</h4>
											<div class="form-group">
												<input id="login-username" type="text" autocomplete="username" class="form-style" placeholder="Email o username">
												<i class="input-icon uil uil-at"></i>
											</div>	
											<div class="form-group mt-2">
												<input id="login-password" type="password" class="form-style" placeholder="Password">
												<i class="input-icon uil uil-lock-alt"></i>
											</div>
											<button id="login-btn" class="btn mt-4">Login</button>
                      
				      					</div>
			      					</div>
			      				</div>
								<div class="card-back">
									<div class="center-wrap">
										<div class="section text-center">
											<h4 class="mb-3 pb-3">Registrati</h4>
											<div class="form-group">
												<input id="reg-username" type="text" class="form-style" placeholder="username">
												<i class="input-icon uil uil-user"></i>
											</div>	
											<div class="form-group mt-2">
												<input id="reg-phone" type="tel" class="form-style" placeholder="numero di telefono">
												<i class="input-icon uil uil-phone"></i>
											</div>	
                      <div class="form-group mt-2">
												<input id="reg-email" type="email" class="form-style" placeholder="Email">
												<i class="input-icon uil uil-at"></i>
											</div>
											<div class="form-group mt-2">
												<input id="reg-password" type="password" class="form-style" placeholder="Password">
												<i class="input-icon uil uil-lock-alt"></i>
											</div>
											<button id="reg-btn" class="btn mt-4">Registrati</button>
				      					</div>
			      					</div>
			      				</div>
			      			</div>
			      		</div>
			      	</div>
		      	</div>
	      	</div>
	    </div>
				</div>

					<div class="section text-center py-3">
						<h5>Azioni rapide (dopo login)</h5>
						<div class="form-group">
							<input id="action-targa" type="text" class="form-style" placeholder="Targa (es. AB123CD)">
						</div>
						<div class="form-group mt-2">
							<input id="action-place" type="number" class="form-style" placeholder="Place ID (es. 1)">
						</div>
						<div class="form-group mt-2">
							<input id="action-percent" type="number" class="form-style" placeholder="Desired % (es. 80)">
						</div>
						<button id="req-charge-btn" class="btn mt-2">Richiedi ricarica</button>
						<button id="view-queue-btn" class="btn mt-2">Mostra coda</button>
						<pre id="action-output" style="text-align:left; max-height:200px; overflow:auto; background:#f8f9fa; padding:8px; border-radius:4px;"></pre>
					</div>

		<script src="app.js"></script>
</body>
</html>
